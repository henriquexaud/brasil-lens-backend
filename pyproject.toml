[project]
name = "brasil-lens-api"
version = "0.1.0"
description = "API de exploração de dados territoriais, demográficos e econômicos do Brasil"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "geoalchemy2==0.16.0",
    "alembic==1.14.0",
    "httpx==0.28.1",
    "orjson==3.10.13",
    "redis==6.4.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "ruff==0.8.4",
    "mypy==1.14.0",
    "respx==0.22.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC"]
ignore = [
    "B008",  # Depends() no default de argumento é o idioma do FastAPI
    # A documentação do projeto é em pt-BR e usa pontuação tipográfica
    # (×, —, aspas curvas) de propósito. RUF001-003 sinalizam esses
    # caracteres como "ambíguos", o que aqui é ruído e não defeito.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# O código é montado em /app (WORKDIR) e não instalado como pacote no
# container de desenvolvimento; sem isto o pytest não encontra `app`.
pythonpath = ["."]
markers = ["db: exige PostgreSQL/PostGIS disponível"]
filterwarnings = ["error::DeprecationWarning:app.*"]
